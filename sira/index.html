<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111"><title>SIRAYLA ÇEVİR</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#0d0d0d;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:manipulation}
body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{width:100%;max-width:480px;padding:16px 4px 0;text-align:center}
h1{font-size:22px;letter-spacing:3px;color:#ffd23f}
.sub{font-size:13px;opacity:.7;margin-top:4px}
.hud{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
.box{flex:1;background:#1c1c1c;border-radius:12px;padding:8px 4px}
.box b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.box span{font-size:11px;opacity:.6;letter-spacing:1px}
#target b{color:#ffd23f}
#board{position:relative;width:min(94vw,440px);aspect-ratio:1/0.92;background:#000 radial-gradient(#ffffff14 1px,transparent 1px) 0 0/9px 9px;border-radius:18px;box-shadow:inset 0 0 30px #000,0 8px 30px #0008}
.disc{position:absolute;width:21%;aspect-ratio:1;perspective:600px;transform:translate(-50%,-50%);cursor:pointer}
.in{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .28s}
.disc.up .in{transform:rotateY(180deg)}
.f{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle at 35% 30%,#fff3a0,#ffd23f 45%,#e0a800);box-shadow:0 5px 0 #a87b00,0 8px 12px #0009}
.b{transform:rotateY(180deg);color:#111;font-weight:900;font-size:clamp(26px,9vw,44px)}
.disc.bad .b{background:radial-gradient(circle at 35% 30%,#ffb3b3,#ff4d4d 50%,#b30000);color:#fff}
.disc.ok .b{background:radial-gradient(circle at 35% 30%,#d4ffd9,#5fe07a 50%,#1f9a3a)}
.disc:active .in{scale:.94}
#board.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
footer{width:100%;max-width:480px;padding:0 4px 18px;display:flex;gap:8px}
button{flex:1;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#ffd23f;color:#111}
button.alt{background:#262626;color:#fff}
#ov{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9}
#ov.on{display:flex}
.card{background:#1a1a1a;border-radius:20px;padding:26px 22px;width:min(88vw,360px);text-align:center}
.card h2{color:#ffd23f;font-size:26px;margin-bottom:8px}
.card p{opacity:.85;margin:6px 0;line-height:1.4}
.card .big{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;margin:10px 0}
.card button{margin-top:14px;width:100%}
.modes{display:flex;gap:6px;margin-top:10px}
.modes button{padding:10px 4px;font-size:14px}
.modes button.sel{outline:3px solid #fff}
.opp{width:min(94vw,440px);background:#1c1c1c;border-radius:12px;padding:8px 12px;display:none;font-size:14px}
.opp.on{display:block}.bar{height:10px;background:#333;border-radius:6px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#ff7a00;transition:width .2s}
#cnt{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:#ffd23f;z-index:8;background:#0008}#cnt.on{display:flex}
input.t{width:100%;padding:12px;border-radius:12px;border:0;font-size:17px;margin-top:10px;text-align:center}
</style></head><body>
<header><h1>SIRAYLA ÇEVİR</h1><div class="sub">1'den başla, sırayla bul. Yanlışta her şey kapanır!</div>
<div class="hud"><div class="box"><b id="time">0.00</b><span>SÜRE</span></div>
<div class="box" id="target"><b id="tg">1</b><span>SIRADAKİ</span></div>
<div class="box"><b id="err">0</b><span>HATA</span></div>
<div class="box"><b id="best">–</b><span>REKOR</span></div></div></header>
<div class="opp" id="opp"><span id="oppn">Rakip</span> <b id="oppt" style="float:right">0/10</b><div class="bar"><i id="oppb"></i></div></div>
<div id="board"></div><div id="cnt"></div>
<footer><button class="alt" id="menuB">Mod</button><button id="newB">Yeni Oyun</button></footer>
<div id="ov"><div class="card" id="cd"></div></div>
<script>
const SB_URL='https://fynlvcdjvyokshfygnxq.supabase.co',SB_KEY='sb_publishable_JsYzqmtEEGNzpDHlft0UOg_SrYaLggD';
async function rpc(fn,body){const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||'Bağlantı hatası');return j}
const PID=localStorage.siraPid||(localStorage.siraPid=(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:(r&3|8)).toString(16)})));
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LAYOUTS={10:[3,4,3],15:[4,4,4,3],6:[3,3]};
let N=+(localStorage.siraN||10),order=[],target=1,errors=0,t0=0,timer=null,lock=false,started=false;
let MODE='local',TOUR=null,DUEL=null,poll=null,busy=false;
const $=id=>document.getElementById(id),board=$('board');
let AC;function beep(f,d=.08,ty='sine',v=.15){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const vib=p=>navigator.vibrate&&navigator.vibrate(p);
function bestKey(){return 'siraBest'+N}
function showBest(){const b=localStorage[bestKey()];$('best').textContent=b?(+b).toFixed(2):'–'}
function startClock(){started=true;t0=performance.now();clearInterval(timer);timer=setInterval(()=>$('time').textContent=((performance.now()-t0)/1000).toFixed(2),30)}
function build(remote){board.innerHTML='';const rows=LAYOUTS[N];
 order=remote?[]:[...Array(N)].map((_,i)=>i+1).sort(()=>Math.random()-.5);
 board.style.aspectRatio=N===6?'1/0.65':N===15?'1/1.05':'1/0.92';
 let k=0;rows.forEach((c,r)=>{for(let i=0;i<c;i++){const d=document.createElement('div');d.className='disc';
  d.style.left=(50+(i-(c-1)/2)*(N===15?22:23))+'%';d.style.top=((r+.5)/rows.length*100)+'%';if(N===15)d.style.width='19%';
  d.dataset.i=k;d.dataset.n=remote?'':order[k];k++;d.innerHTML='<div class="in"><div class="f"></div><div class="f b">'+(d.dataset.n)+'</div></div>';
  d.addEventListener('pointerdown',()=>tap(d));board.appendChild(d)}});}
function hud(){$('tg').textContent=target>N?'✓':target;$('err').textContent=errors}
function reset(mode){MODE=mode||'local';if(MODE==='local'){TOUR=null;stopDuel()}clearInterval(timer);target=1;errors=0;started=false;lock=false;busy=false;
 $('time').textContent='0.00';hud();showBest();if(MODE!=='local')N=10;build(MODE!=='local');$('opp').classList.toggle('on',MODE==='duel')}
function fail(d){lock=true;errors++;hud();d.classList.add('bad');beep(140,.3,'square',.12);vib([60,40,60]);board.classList.add('shake');
 setTimeout(()=>{board.classList.remove('shake');document.querySelectorAll('.disc.up').forEach(x=>x.classList.remove('up'));
  setTimeout(()=>{d.classList.remove('bad');target=1;hud();lock=false},300)},850)}
function good(){beep(400+target*60);vib(15);target++;hud()}
function celebrate(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*110));vib([30,30,30,30,80]);document.querySelectorAll('.disc').forEach((x,i)=>setTimeout(()=>x.classList.add('ok'),i*40))}
async function tap(d){if(lock||busy||d.classList.contains('up'))return;
 if(MODE==='local'){if(!started)startClock();const n=+d.dataset.n;d.classList.add('up');if(n===target){good();if(target>N)winLocal()}else fail(d);return}
 if(!started)return;busy=true;
 try{const r=MODE==='tour'?await rpc('flip_run',{p_id:TOUR.id,p_player:PID,p_idx:+d.dataset.i}):await rpc('duel_flip',{p_id:DUEL.id,p_player:PID,p_idx:+d.dataset.i});
  busy=false;if(r.over){return}
  d.querySelector('.b').textContent=r.n;d.classList.add('up');
  if(r.ok){good();if(r.done){clearInterval(timer);lock=true;$('time').textContent=(r.ms/1000).toFixed(2);celebrate();
    if(MODE==='tour')setTimeout(()=>ov(`<h2>TURNUVA 🏆</h2><div class="big">${(r.ms/1000).toFixed(2)} sn</div><p>Bu haftaki sıran: <b>${r.rank}.</b></p><p>${errors} hata</p><button onclick="tourMenu()">Tekrar Dene</button><button class="alt" onclick="board_()">Sıralama</button><button class="alt" onclick="share(${(r.ms/1000).toFixed(2)})">Paylaş</button>`),600)}}
  else fail(d)}catch(e){busy=false;ov(`<h2>Bağlantı sorunu</h2><p>${esc(e.message)}</p><button onclick="menu()">Ana Menü</button>`)}}
function winLocal(){clearInterval(timer);lock=true;const t=(performance.now()-t0)/1000;$('time').textContent=t.toFixed(2);celebrate();
 const old=+localStorage[bestKey()]||0,rec=!old||t<old;if(rec)localStorage[bestKey()]=t;showBest();
 setTimeout(()=>ov(`<h2>${rec?'YENİ REKOR! 🏆':'BİTTİ! 🎉'}</h2><div class="big">${t.toFixed(2)} sn</div><p>${errors} hata ile tamamladın.</p>${rec?'':'<p>Rekorun: '+old.toFixed(2)+' sn</p>'}<button onclick="hide();reset()">Tekrar Oyna</button><button class="alt" onclick="share(${t.toFixed(2)})">Skoru Paylaş</button>`),700)}
function share(t,txt){txt=txt||`SIRAYLA ÇEVİR oyununu ${N} pulla ${t} saniyede bitirdim! Sen kaç saniyede bitirirsin?`;const u=location.origin+location.pathname;
 if(navigator.share)navigator.share({text:txt,url:u}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(txt+' '+u);alert('Kopyalandı!')}}
function ov(h){$('cd').innerHTML=h;$('ov').classList.add('on')}function hide(){$('ov').classList.remove('on')}
function nameInput(){return `<input class="t" id="nm" maxlength="16" placeholder="Takma adın" value="${esc(localStorage.siraName||'')}">`}
function getName(){const nm=($('nm')&&$('nm').value||'').trim();if(nm.length<2){alert('En az 2 harfli bir takma ad yaz');return null}localStorage.siraName=nm;return nm}
function menu(){stopDuel();bStop&&bStop();ov(`<h2>SIRAYLA ÇEVİR</h2><p>Kapalı pullardan birine dokun. Sıradaki sayıysa açık kalır, değilse <b>hepsi kapanır</b> ve 1'den başlarsın.</p><div class="modes">${[6,10,15].map(m=>`<button class="${m===N?'sel':'alt'}" onclick="N=${m};localStorage.siraN=${m};menu()">${m===6?'Kolay':m===10?'Klasik':'Zor'}<br><small>${m} pul</small></button>`).join('')}</div><button onclick="hide();reset()">Antrenman</button><button style="background:#ff7a00;color:#fff" onclick="tourMenu()">🏆 Haftalık Turnuva</button><button style="background:#3b82f6;color:#fff" onclick="duelMenu()">⚔️ 1'e 1 Düello</button><button style="background:#16a34a;color:#fff" onclick="bMenu()">🏟️ Eleme Turnuvası</button>`)}
// TURNUVA
function tourMenu(){stopDuel();ov(`<h2>🏆 HAFTALIK TURNUVA</h2><p>Bu hafta herkes <b>aynı tahtayı</b> oynar. En iyi süren sıralamaya girer, istediğin kadar dene!</p><p>Süreyi sunucu tutar: <b>Başla</b>'ya basınca başlar.</p>${nameInput()}<button onclick="startTour()">Başla</button><button class="alt" onclick="board_()">Sıralamayı Gör</button><button class="alt" onclick="menu()">Geri</button>`)}
async function startTour(){const nm=getName();if(!nm)return;ov('<h2>Hazırlanıyor…</h2>');
 try{TOUR=await rpc('start_run',{p_player:PID,p_name:nm});hide();reset('tour');startClock()}catch(e){ov(`<h2>Olmadı 😕</h2><p>${esc(e.message)}</p><button onclick="tourMenu()">Geri</button>`)}}
async function board_(){ov('<h2>Sıralama</h2><p>Yükleniyor…</p>');try{const L=await rpc('leaderboard',{});const me=localStorage.siraName;
 ov(`<h2>🏆 Bu Haftanın Sıralaması</h2><div style="max-height:52vh;overflow:auto;text-align:left;margin-top:8px">${L.length?L.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;${r.name===me?'background:#ffd23f33':''}"><span>${i<3?['🥇','🥈','🥉'][i]:(i+1)+'.'} ${esc(r.name)}</span><b>${(r.ms/1000).toFixed(2)} sn</b></div>`).join(''):'<p style="text-align:center">Henüz kimse bitirmedi. İlk sen ol!</p>'}</div><button onclick="tourMenu()">Oyna</button><button class="alt" onclick="menu()">Ana Menü</button>`)}catch(e){ov(`<h2>Bağlantı yok</h2><p>${esc(e.message)}</p><button onclick="menu()">Geri</button>`)}}
// DUELLO
function duelMenu(code){stopDuel();bStop();ov(`<h2>⚔️ 1'E 1 DÜELLO</h2><p>İkiniz <b>aynı tahtayı</b> aynı anda oynarsınız. Önce 10'a ulaşan kazanır!</p>${nameInput()}<button onclick="duelGo('find')">🎲 Rastgele Rakip Bul</button><button style="background:#3b82f6;color:#fff" onclick="duelGo('create')">🔗 Arkadaşa Oda Aç</button><input class="t" id="code" maxlength="5" placeholder="Oda kodu" value="${esc(code||'')}" style="text-transform:uppercase"><button class="alt" onclick="duelGo('join')">Koda Katıl</button><button class="alt" onclick="duelBoard()">🏅 Düello Sıralaması</button><button class="alt" onclick="menu()">Geri</button>`)}
async function duelGo(kind){const nm=getName();if(!nm)return;let code=kind==='join'?($('code').value||'').trim().toUpperCase():null;if(kind==='join'&&code.length<5){alert('5 harfli oda kodunu yaz');return}
 ov('<h2>Bağlanıyor…</h2>');
 try{DUEL=kind==='find'?await rpc('duel_find',{p_player:PID,p_name:nm}):kind==='create'?await rpc('duel_create',{p_player:PID,p_name:nm}):await rpc('duel_join',{p_code:code,p_player:PID,p_name:nm});
  DUEL.kind=kind;DUEL.phase='wait';reset('duel');lock=true;waitScreen();poll=setInterval(duelTick,800);duelTick()}catch(e){ov(`<h2>Olmadı 😕</h2><p>${esc(e.message)}</p><button onclick="duelMenu()">Geri</button>`)}}
function waitScreen(){if(DUEL.kind==='bracket'){ov(`<h2>Maç Hazırlanıyor</h2><p>Rakibin: <b>${esc(DUEL.opp)}</b></p><p>İkiniz de girince 3'ten geri sayım başlar. 90 saniye içinde gelmeyen elenir.</p><div class="big">⏳</div><button class="alt" onclick="bOpen('${DUEL.bid}')">Turnuvaya Dön</button>`);return}const link=location.origin+location.pathname+'?oda='+DUEL.id;
 ov(DUEL.kind==='create'?`<h2>Oda Açıldı</h2><p>Arkadaşına bu kodu ya da linki gönder:</p><div class="big" style="letter-spacing:6px">${DUEL.id}</div><button onclick="share(0,'SIRAYLA ÇEVİR düellosuna gel! Oda: ${DUEL.id} ${link}')">Linki Paylaş</button><p style="opacity:.6">Rakip bekleniyor…</p><button class="alt" onclick="leaveDuel()">Vazgeç</button>`
 :`<h2>Rakip Aranıyor…</h2><p>Biri katılınca oyun otomatik başlar.</p><div class="big">⏳</div><button class="alt" onclick="leaveDuel()">Vazgeç</button>`)}
let cdT=null;
async function duelTick(){if(!DUEL)return;let s;try{if(DUEL.kind==='bracket'&&DUEL.phase==='wait')await rpc('duel_ready',{p_id:DUEL.id,p_player:PID});s=await rpc('duel_state',{p_id:DUEL.id,p_player:PID})}catch(e){return}
 if(!DUEL)return;const me=s.slot,op=me===1?2:1,on=s['p'+op+'name'];
 if(on){$('oppn').textContent='⚔️ '+on;const ot=Math.min(s['t'+op]-1,10);$('oppt').textContent=ot+'/10';$('oppb').style.width=ot*10+'%'}
 if(DUEL.phase==='wait'&&s.wait_ms!==null){DUEL.phase='count';hide();let left=Math.max(0,s.wait_ms);const c=$('cnt');c.classList.add('on');
  const step=()=>{const k=Math.ceil(left/1000);c.textContent=k>0?k:'BAŞLA!';if(k>0)beep(600,.1);if(left<=0){beep(900,.2);setTimeout(()=>c.classList.remove('on'),400);DUEL.phase='play';lock=false;startClock();return}
   const w=Math.min(left,(left%1000)||1000);left-=w;cdT=setTimeout(step,w)};step()}
 if(s.winner&&DUEL.phase!=='end'){DUEL.phase='end';clearInterval(timer);lock=true;const win=s.winner===me,mms=s['ms'+me],oms=s['ms'+op];
  if(win)celebrate();else{beep(200,.4,'sawtooth',.1);vib(200)}
  setTimeout(()=>ov(`<h2>${win?'KAZANDIN! 🏆':'KAYBETTİN 😔'}</h2><p>${win&&!mms?esc(on)+' oyundan çıktı.':win?'<span class="big">'+(mms/1000).toFixed(2)+' sn</span>':esc(on)+' '+(oms?(oms/1000).toFixed(2)+' sn ile':'')+' önce bitirdi.'}</p><p>Hatalar: sen ${s['e'+me]}, rakip ${s['e'+op]}</p>${DUEL.kind==='bracket'?`<button onclick="bOpen('${DUEL.bid}')">Turnuvaya Dön</button>`:'<button onclick="duelMenu()">Yeni Düello</button>'}<button class="alt" onclick="menu()">Ana Menü</button>`),win?700:300);stopPoll()}
 else if(s.gone&&DUEL.phase!=='end'&&DUEL.phase!=='wait'){rpc('duel_claim',{p_id:DUEL.id,p_player:PID}).catch(()=>{});}}

async function duelBoard(){ov('<h2>Düello Sıralaması</h2><p>Yükleniyor…</p>');try{const L=await rpc('duel_leaderboard',{});const me=localStorage.siraName;
 ov(`<h2>🏅 Bu Haftanın Düellocuları</h2><div style="max-height:52vh;overflow:auto;text-align:left;margin-top:8px">${L.length?L.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;${r.name===me?'background:#3b82f633':''}"><span>${i<3?['🥇','🥈','🥉'][i]:(i+1)+'.'} ${esc(r.name)}</span><b>${r.wins} G · ${r.losses} M</b></div>`).join(''):'<p style="text-align:center">Bu hafta henüz düello yok.</p>'}</div><button onclick="duelMenu()">Düelloya Dön</button>`)}catch(e){ov(`<h2>Bağlantı yok</h2><p>${esc(e.message)}</p><button onclick="duelMenu()">Geri</button>`)}}
// ELEME TURNUVASI
let BP=null,BID=null;
function bStop(){clearInterval(BP);BP=null}
function bMenu(code){stopDuel();bStop();ov(`<h2>🏟️ ELEME TURNUVASI</h2><p>16 kişiye kadar. Herkes linkle katılır, kuran başlatır. Her tur 1'e 1 düello, kazanan üst tura çıkar, son kalan şampiyon!</p>${nameInput()}<input class="t" id="code" maxlength="5" placeholder="Turnuva kodu" value="${esc(code||'')}" style="text-transform:uppercase"><button style="background:#16a34a;color:#fff" onclick="bGo('join')">Turnuvaya Katıl</button><input class="t" id="ttl" maxlength="30" placeholder="Turnuva adı (örn: 8-A Sınıfı)"><button onclick="bGo('create')">Yeni Turnuva Kur</button><button class="alt" onclick="menu()">Geri</button>`)}
async function bGo(kind){const nm=getName();if(!nm)return;ov('<h2>Bağlanıyor…</h2>');
 try{let r;if(kind==='create')r=await rpc('bracket_create',{p_player:PID,p_name:nm,p_title:($('ttl')?$('ttl').value:'')});
  else{const c=(($('code')&&$('code').value)||'').trim().toUpperCase();if(c.length<5)throw new Error('5 harfli turnuva kodunu yaz');r=await rpc('bracket_join',{p_code:c,p_player:PID,p_name:nm})}
  localStorage.siraBracket=r.id;bOpen(r.id)}catch(e){ov(`<h2>Olmadı 😕</h2><p>${esc(e.message)}</p><button onclick="bMenu()">Geri</button>`)}}
function bOpen(id){stopDuel();bStop();BID=id;reset('duel');$('opp').classList.remove('on');lock=true;bTick();BP=setInterval(bTick,1500)}
async function bTick(){if(!BID)return;let s;try{s=await rpc('bracket_state',{p_code:BID,p_player:PID})}catch(e){bStop();ov(`<h2>Olmadı</h2><p>${esc(e.message)}</p><button onclick="bMenu()">Geri</button>`);return}
 if(!BP&&!document.getElementById('cd'))return;
 const link=location.origin+location.pathname+'?turnuva='+s.id;
 if(s.status==='lobby'){ov(`<h2>🏟️ ${esc(s.title)}</h2><p>Kod</p><div class="big" style="letter-spacing:6px">${s.id}</div><button onclick="share(0,'${esc(s.title).replace(/'/g,'')} turnuvasına katıl! SIRAYLA ÇEVİR. Kod: ${s.id} ${link}')">Davet Linkini Paylaş</button><p><b>${s.players.length}/16</b> oyuncu:</p><div style="max-height:28vh;overflow:auto">${s.players.map(n=>`<span style="display:inline-block;background:#262626;border-radius:8px;padding:4px 8px;margin:3px">${esc(n)}</span>`).join('')}</div>${s.host?(s.players.length>=2?`<button style="background:#16a34a;color:#fff" onclick="bStart('${s.id}')">Turnuvayı Başlat</button>`:'<p style="opacity:.6">Başlatmak için en az 2 oyuncu lazım.</p>'):'<p style="opacity:.6">Kuranın başlatması bekleniyor…</p>'}<button class="alt" onclick="bStop();menu()">Ana Menü</button>`);return}
 const tree=bTree(s);
 if(s.status==='done'){bStop();ov(`<h2>🏆 ŞAMPİYON</h2><div class="big">${esc(s.winner)}</div>${tree}<button onclick="share(0,'${esc(s.title).replace(/'/g,'')} turnuvasının şampiyonu: ${esc(s.winner).replace(/'/g,'')}! ${location.origin+location.pathname}')">Paylaş</button><button class="alt" onclick="menu()">Ana Menü</button>`);if(s.winner===localStorage.siraName)celebrate();return}
 if(s.my_duel){bStop();const opp=s.slots.length;DUEL={id:s.my_duel,kind:'bracket',phase:'wait',bid:s.id,opp:''};
  try{const st=await rpc('duel_state',{p_id:s.my_duel,p_player:PID});DUEL.opp=st.slot===1?st.p2name:st.p1name}catch(e){}
  reset('duel');lock=true;waitScreen();poll=setInterval(duelTick,800);duelTick();return}
 ov(`<h2>🏟️ ${esc(s.title)}</h2><p>${s.alive?'Rakibin belirlenmesi bekleniyor… Diğer maçlar sürüyor.':'Elendin 😔 Turnuvayı izleyebilirsin.'}</p>${tree}<button class="alt" onclick="bStop();menu()">Ana Menü</button>`)}
function bTree(s){const R=s.rounds||1;let h='<div style="display:flex;gap:6px;overflow-x:auto;text-align:left;font-size:12px;margin:8px 0;max-height:46vh">';
 for(let r=1;r<=R;r++){const n=s.size/Math.pow(2,r-1);const title=r===R?'Final':r===R-1?'Yarı Final':r===R-2?'Çeyrek':r+'. Tur';
  h+=`<div style="min-width:86px;flex:1"><div style="opacity:.6;margin-bottom:4px">${title}</div>`;
  for(let p=0;p<n;p++){const sl=s.slots.find(x=>x.r===r&&x.p===p);const bye=r===1&&!sl&&s.slots.find(x=>x.r===1&&x.p===(p^1));
   h+=`<div style="background:${sl&&sl.me?'#ffd23f44':'#262626'};border-radius:6px;padding:4px 6px;margin-bottom:${p%2?8:2}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sl?esc(sl.n):bye?'<i style="opacity:.5">bay</i>':'<span style="opacity:.4">—</span>'}</div>`}
  h+='</div>'}
 return h+'</div>'}
async function bStart(id){try{await rpc('bracket_start',{p_code:id,p_player:PID});bTick()}catch(e){alert(e.message)}}
function stopPoll(){clearInterval(poll);poll=null}
function stopDuel(){stopPoll();clearTimeout(cdT);$('cnt').classList.remove('on');if(DUEL&&DUEL.phase!=='end'&&DUEL.kind!=='bracket'){const d=DUEL;rpc('duel_forfeit',{p_id:d.id,p_player:PID}).catch(()=>{})}DUEL=null;$('opp').classList.remove('on')}
function leaveDuel(){stopDuel();duelMenu()}
$('newB').onclick=()=>MODE==='tour'?tourMenu():MODE==='duel'?duelMenu():reset();$('menuB').onclick=()=>menu();
reset();const Q=new URLSearchParams(location.search),qp=Q.get('oda'),qt=Q.get('turnuva');if(qt)bMenu(qt.toUpperCase());else if(qp)duelMenu(qp.toUpperCase());else menu();
</script></body></html>
