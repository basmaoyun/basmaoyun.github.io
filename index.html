<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BASMA!</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,Arial,sans-serif;overflow:hidden;touch-action:manipulation}
#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#lvl{color:#39ff6a;font-weight:800;letter-spacing:2px;font-size:14px}
#stage{position:relative;width:min(82vw,82vh*.6,380px);aspect-ratio:1}
svg{position:absolute;inset:0;width:100%;height:100%}
#btn{position:absolute;inset:13%;border-radius:50%;border:3px solid #39ff6a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12%;font-weight:900;text-transform:uppercase;font-size:clamp(15px,5vw,22px);line-height:1.15;transition:transform .05s}
#btn:active{transform:scale(.96)}
#icon{font-size:clamp(34px,13vw,64px);line-height:1;margin-bottom:6px}
#taps{color:#39ff6a;font-size:13px;height:16px}
.dead #btn{background:#e01b24;border-color:#e01b24}
#start{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5;text-align:center;padding:24px}
#start h1{color:#39ff6a;font-size:44px;margin:0;letter-spacing:3px}
#start p{color:#aaa;max-width:300px;margin:0}
#start button{background:none;border:3px solid #39ff6a;color:#fff;font-weight:900;font-size:20px;padding:14px 34px;border-radius:40px}
</style></head><body>
<div id="start"><h1>BASMA!</h1><p>Talimatları oku, kuralları aklında tut. Süre bitmeden doğru sayıda bas. Hata yok.</p><button id="go">BAŞLA</button><p id="best"></p></div>
<div id="wrap"><div id="lvl"></div><div id="stage"><svg viewBox="0 0 100 100" id="ring"></svg><div id="btn"><div id="icon"></div><div id="txt"></div></div></div><div id="taps"></div></div>
<script>
// Her seviye: t=metin, i=ikon, n=doğru basma sayısı (fonksiyon olabilir), d=süre(sn)
const L=[
{t:"BASMA",n:0},
{t:"BAS",n:1},
{t:"SONUNCUYLA AYNI",n:1,d:4},
{t:"BU SAYIYI AKLINDA TUT: 7",n:0,d:3},
{t:"1+2+3-1 KEZ BAS",n:5,d:6},
{t:"FARE GÖRÜNCE HER ZAMAN BİR KEZ BAS",n:0,d:4,rule:"rat"},
{t:"HER KÖŞE İÇİN BİR KEZ BAS",i:"★",n:10,d:8},
{t:"BASMA",i:"🐀",n:1},
{t:"BU CÜMLEDEKİ HER KELİME İÇİN BİR KEZ BAS",n:8,d:7},
{t:"KEDİLER ÇİFT SAYIDAYSA BİR KEZ BAS",n:0,d:4},
{t:"ÇABUK, BASMA!!!",n:0,d:2},
{t:"HER KÖŞE İÇİN BİR KEZ BAS",i:"▲",n:3,d:5},
{t:"",i:"🐈🐈<br>🐈🐈",n:1},
{t:"2'DEN AZ BAS",n:[0,1]},
{t:"ÖRÜMCEK GÖRÜNCE ASLA BASMA",n:0,d:4},
{t:"İNSANSAN BAS",i:"🕷️",n:0},
{t:"KORKUTMACA SEVİYORSAN BAS",n:[0,1]},
{t:"SAAT KAÇ?",i:"🕖",n:7,d:7},
{t:"DAHA ÖNCE GÖRDÜĞÜN HER KEDİ İÇİN BİR KEZ BAS",n:4,d:6},
{t:"AKLINDAKİ SAYI KADAR BAS",n:7,d:7},
{t:"",i:"🐈🐈🐈",n:0},
{t:"BAS",i:"🐀🕷️",n:0},
{t:"HİÇ BASMADIĞIN KADAR BAS",n:0,d:3},
{t:"BAS BAS BAS",n:3,d:4},
{t:"TEBRİKLER! BİTTİ. BAS",n:0,d:3,trap:1},
{t:"🏆 GERÇEKTEN BİTTİ",n:-1}
];
const SEG=24,btn=document.getElementById('btn'),ring=document.getElementById('ring'),txt=document.getElementById('txt'),icon=document.getElementById('icon'),lvl=document.getElementById('lvl'),tapsEl=document.getElementById('taps'),st=document.getElementById('start');
let k=0,taps=0,t0=0,dur=0,raf,alive=false,ac;
const best=()=>+localStorage.basmaBest||0;document.getElementById('best').textContent=best()?"En iyi: "+best()+". seviye":"";
let segs="";for(let s=0;s<SEG;s++){const a1=(s/SEG)*2*Math.PI-Math.PI/2+.04,a2=((s+1)/SEG)*2*Math.PI-Math.PI/2-.04,r=46;segs+=`<path id="s${s}" d="M${50+r*Math.cos(a1)} ${50+r*Math.sin(a1)} A${r} ${r} 0 0 1 ${50+r*Math.cos(a2)} ${50+r*Math.sin(a2)}" stroke="#39ff6a" stroke-width="6" fill="none"/>`}ring.innerHTML=segs;
function beep(f,len,type){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=type||"square";o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+len);o.stop(ac.currentTime+len)}catch(e){}}
function show(){const L0=L[k];document.body.className="";ring.querySelectorAll('path').forEach(p=>{p.style.opacity=1;p.setAttribute('stroke','#39ff6a')});
 icon.innerHTML=L0.i||"";txt.textContent=L0.t;lvl.textContent="SEVİYE "+(k+1);taps=0;tapsEl.textContent="";
 if(L0.n===-1){alive=false;localStorage.basmaBest=L.length;return}
 dur=(L0.d||3)*1000;t0=performance.now();alive=true;cancelAnimationFrame(raf);tick()}
function tick(){const p=(performance.now()-t0)/dur,left=Math.ceil((1-p)*SEG);for(let s=0;s<SEG;s++)document.getElementById('s'+s).style.opacity=s<left?1:0;
 if(p>=1){judge();return}raf=requestAnimationFrame(tick)}
function ok(n){const want=L[k].n;return Array.isArray(want)?want.includes(n):want===n}
function judge(){alive=false;if(ok(taps)){beep(880,.08);k++;btn.style.opacity=0;setTimeout(()=>{btn.style.opacity=1;show()},150)}else die()}
function die(){alive=false;cancelAnimationFrame(raf);document.body.className="dead";ring.querySelectorAll('path').forEach(p=>{p.style.opacity=1;p.setAttribute('stroke','#e01b24')});
 icon.textContent="💀";txt.textContent="ÖLÜMCÜL SAPMA";tapsEl.textContent="Tekrar denemek için dokun";beep(90,.6,"sawtooth");beep(140,.6,"sawtooth");if(navigator.vibrate)navigator.vibrate(300);
 if(k+1>best())localStorage.basmaBest=k+1}
btn.addEventListener('pointerdown',e=>{e.preventDefault();
 if(document.body.className==="dead"){k=0;show();return}
 if(!alive)return;taps++;beep(440,.04);tapsEl.textContent="•".repeat(Math.min(taps,20));
 // fazla basınca anında öl
 const w=L[k].n,max=Array.isArray(w)?Math.max(...w):w;if(taps>max){die();return}
 if(taps===max&&max>0){alive=false;cancelAnimationFrame(raf);setTimeout(judge,250)}});
document.getElementById('go').onclick=()=>{st.remove();k=0;show()};
</script></body></html>
