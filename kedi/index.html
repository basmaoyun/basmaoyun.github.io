<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e"><title>Kedi Zıplama</title>
<style>
*{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1a2e;font-family:system-ui,Arial,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
#ui{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;color:#fff;font-weight:800;font-size:22px;text-shadow:0 2px 4px #0006;pointer-events:none}
#combo{position:fixed;top:28%;width:100%;text-align:center;color:#ffd32a;font-weight:900;font-size:34px;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 3px 6px #0007}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1a1a2ecc;color:#fff;text-align:center;padding:24px}
#ov h1{margin:0;font-size:42px}#ov p{margin:0;opacity:.85;max-width:300px;line-height:1.4}
#ov button{border:0;background:#ff9f43;color:#fff;font-size:22px;font-weight:900;padding:14px 40px;border-radius:40px;box-shadow:0 4px 0 #ee5a24}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui"><span>🐟 <span id="sc">0</span></span><span>🏆 <span id="best">0</span></span></div>
<div id="combo"></div>
<div id="ov"><h1>🐱 Kedi Zıplama</h1><p>Ekrana <b>basılı tut</b>, güç biriksin. <b>Bırak</b>, kedi bir sonraki platforma zıplasın. Ortaya inersen kombo yaparsın!</p><p>🐟 balık +3 · 🥛 süt +5 · mor platformlar kayar</p><button id="go">OYNA</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),scEl=document.getElementById('sc'),bestEl=document.getElementById('best'),comboEl=document.getElementById('combo'),ov=document.getElementById('ov');
let W,H,S;function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(W/400,H/700)}addEventListener('resize',rs);rs();
let best=+localStorage.kediBest||0;bestEl.textContent=best;
let pdir=1,st,cat,plats,cam,score,combo,charging,power,cur,parts;
const G=()=>0.55*S,MAXP=1;
function newPlat(prev){const w=(70+Math.random()*50)*S*(score>20?.8:1);let x;do{x=40*S+Math.random()*(W-80*S-w)}while(Math.abs(x+w/2-(prev.x+prev.w/2))<70*S);
 const r=Math.random(),type=score>5&&r<.18?'move':r<.33?'fish':r<.4?'milk':'n';return{x,y:prev.y-(95+Math.random()*35)*S,w,h:18*S,type,dir:1,got:false,scored:false}}
function reset(){score=0;combo=0;charging=false;power=0;parts=[];cam=0;const p0={x:W/2-70*S,y:H*.75,w:140*S,h:18*S,type:'n',scored:true};plats=[p0];for(let i=0;i<6;i++)plats.push(newPlat(plats[plats.length-1]));
 cat={x:W/2,y:p0.y,vx:0,vy:0,r:18*S,ground:true,sq:1};cur=p0;scEl.textContent=0;st='play'}
let ac;function snd(f,l,t='sine',v=.15){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.5,ac.currentTime+l);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+l);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+l)}catch(e){}}
let chOsc;function next(){return plats.find(p=>p.y<cur.y-1)}
function down(e){e.preventDefault();if(st!=='play'||!cat.ground)return;charging=true;power=0;pdir=1}
function up(e){e.preventDefault();if(!charging)return;charging=false;const n=next(),dir=n?Math.sign(n.x+n.w/2-cat.x)||1:1,p=Math.max(power,.08);
 cat.vy=-(7+p*9)*S;cat.vx=dir*p*7.2*S;cat.ground=false;cat.sq=1;snd(300+p*400,.15,'triangle');if(navigator.vibrate)navigator.vibrate(15)}
cv.addEventListener('pointerdown',down);addEventListener('pointerup',up);addEventListener('pointercancel',up);
function burst(x,y,c,n=12){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*6*S,vy:-Math.random()*5*S,l:1,c})}
function showCombo(t){comboEl.textContent=t;comboEl.style.opacity=1;clearTimeout(showCombo.t);showCombo.t=setTimeout(()=>comboEl.style.opacity=0,700)}
function land(p){cat.y=p.y;cat.vy=0;cat.vx=0;cat.ground=true;cat.sq=.6;
 if(p===cur)return;cur=p;if(p.scored)return;p.scored=true;const off=Math.abs(cat.x-(p.x+p.w/2))/(p.w/2);let pts=1;
 if(off<.22){combo++;pts=1+combo;showCombo(combo>1?'MÜKEMMEL x'+combo+'!':'MÜKEMMEL!');snd(880,.2);burst(cat.x,p.y,'#ffd32a',18)}else{combo=0;snd(520,.1)}
 if(p.type==='fish'&&!p.got){pts+=3;p.got=1;burst(cat.x,p.y-20*S,'#74b9ff')}if(p.type==='milk'&&!p.got){pts+=5;p.got=1;burst(cat.x,p.y-20*S,'#fff')}
 score+=pts;scEl.textContent=score;while(plats.length<8)plats.push(newPlat(plats[plats.length-1]))}
function die(){st='over';snd(200,.5,'sawtooth');if(navigator.vibrate)navigator.vibrate(250);if(score>best){best=score;localStorage.kediBest=best;bestEl.textContent=best}
 ov.querySelector('h1').textContent='😿 Düştün!';ov.querySelector('p').innerHTML='Skor: <b>'+score+'</b><br>En iyi: <b>'+best+'</b>';ov.querySelectorAll('p')[1].textContent='';ov.querySelector('button').textContent='TEKRAR';ov.style.display='flex'}
function update(){if(st!=='play')return;
 if(charging){power+=.018*pdir;if(power>=MAXP){power=MAXP;pdir=-1}else if(power<=0){power=0;pdir=1}cat.sq=1-power*.35}
 plats.forEach(p=>{if(p.type==='move'){const dx=p.dir*1.1*S;p.x+=dx;if(p.x<10||p.x+p.w>W-10)p.dir*=-1;if(cat.ground&&p===cur)cat.x+=dx}});
 if(!cat.ground){const py=cat.y;cat.vy+=G();cat.x+=cat.vx;cat.y+=cat.vy;if(cat.x<cat.r){cat.x=cat.r;cat.vx*=-.5}if(cat.x>W-cat.r){cat.x=W-cat.r;cat.vx*=-.5}
  if(cat.vy>0)for(const p of plats){if(py<=p.y&&cat.y>=p.y&&cat.x>p.x-4*S&&cat.x<p.x+p.w+4*S){land(p);break}}}
 else if(cat.x<cur.x-4*S||cat.x>cur.x+cur.w+4*S)cat.ground=false;
 cat.sq+=(1-cat.sq)*(charging?0:.2);
 const target=cat.y-H*.62;if(target<cam)cam+=(target-cam)*.08;
 plats=plats.filter(p=>p.y-cam<H+60);
 if(cat.y-cam>H+60)die();
 parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.25*S;q.l-=.03});parts=parts.filter(q=>q.l>0)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill()}
function draw(){const g=ctx.createLinearGradient(0,0,0,H),hue=200-Math.min(score,80);g.addColorStop(0,`hsl(${hue},70%,70%)`);g.addColorStop(1,'#e0f7fa');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 plats.forEach(p=>{const y=p.y-cam;ctx.fillStyle=p.type==='move'?'#8e44ad':'#6c5ce7';rr(p.x,y,p.w,p.h,8*S);ctx.fillStyle='#a29bfe';rr(p.x,y,p.w,6*S,4*S);
  ctx.fillStyle='#ffffff55';ctx.fillRect(p.x+p.w/2-3*S,y+2*S,6*S,3*S);
  if((p.type==='fish'||p.type==='milk')&&!p.got){ctx.font=`${24*S}px serif`;ctx.textAlign='center';ctx.fillText(p.type==='fish'?'🐟':'🥛',p.x+p.w/2+p.w*.25,y-6*S)}});
 const n=next();if(cat.ground&&n){ctx.globalAlpha=.25;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(n.x+n.w/2,n.y-cam,5*S,0,7);ctx.fill();ctx.globalAlpha=1}
 const cx=cat.x,cy=cat.y-cam,r=cat.r,sy=cat.sq,sx=1/Math.sqrt(sy);ctx.save();ctx.translate(cx,cy);ctx.scale(sx,sy);ctx.translate(0,-r);
 ctx.fillStyle='#ff9f43';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.fillStyle='#ee5a24';
 [[-1],[1]].forEach(([s])=>{ctx.beginPath();ctx.moveTo(s*r*.75,-r*.45);ctx.lineTo(s*r*.45,-r*1.25);ctx.lineTo(s*r*.05,-r*.8);ctx.fill()});
 ctx.fillStyle='#000';const blink=charging?.4:1;ctx.beginPath();ctx.ellipse(-r*.35,-r*.1,3*S,3*S*blink,0,0,7);ctx.ellipse(r*.35,-r*.1,3*S,3*S*blink,0,0,7);ctx.fill();
 ctx.fillStyle='#ff6b81';ctx.beginPath();ctx.arc(0,r*.15,2.5*S,0,7);ctx.fill();ctx.restore();
 if(charging){ctx.fillStyle='#0003';rr(W/2-80*S,H-50*S,160*S,14*S,7*S);ctx.fillStyle=power>.85?'#ff4757':'#ffd32a';rr(W/2-80*S,H-50*S,160*S*power,14*S,7*S)}
 parts.forEach(q=>{ctx.globalAlpha=q.l;ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y-cam,4*S,4*S)});ctx.globalAlpha=1}
function loop(){update();draw();requestAnimationFrame(loop)}
document.getElementById('go').onclick=e=>{e.stopPropagation();ov.style.display='none';reset();snd(440,.1)};
reset();st='menu';loop();
</script></body></html>
